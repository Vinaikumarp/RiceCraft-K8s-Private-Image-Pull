
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zomato
  namespace: dev
spec:
  serviceName: my-svc
  replicas: 4
  selector:
    matchLabels:
      app: fooddelivery
  template:
    metadata:
      labels:
        app: fooddelivery
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: food
          image: vinaikumarp/qualityrices:v1
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: crex
          resources:
            requests:
              cpu: 100m
              memory: 120Mi
            limits:
              cpu: 500m
              memory: 256Mi
